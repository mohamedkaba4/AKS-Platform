apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          ports:
            - containerPort: {{ .Values.admin.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.admin.envSecret }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: {{ .Values.admin.port }}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: {{ .Values.admin.port }}
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.admin.port }}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.admin.service.type }}
  selector:
    app: admin
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: {{ .Values.admin.port }}
