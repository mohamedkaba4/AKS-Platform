{{- if and .Values.ingress.enabled .Values.ingress.hybrid.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mavencrest-aks-hybrid
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.hybrid.host }}
      secretName: aks-arc-mavencrest-tls
  rules:
    - host: {{ .Values.ingress.hybrid.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: {{ .Values.storefront.service.port }}
{{- end }}
