apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.storefront.replicaCount }}
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: storefront
          image: "{{ .Values.storefront.image.repository }}:{{ .Values.storefront.image.tag }}"
          ports:
            - containerPort: {{ .Values.storefront.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.storefront.envSecret }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: {{ .Values.storefront.port }}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.storefront.port }}
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.storefront.port }}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.storefront.service.type }}
  selector:
    app: storefront
  ports:
    - port: {{ .Values.storefront.service.port }}
      targetPort: {{ .Values.storefront.port }}
