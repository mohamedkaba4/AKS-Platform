apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-observability
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mohamedkaba4/AKS-Platform.git
    targetRevision: main
    path: k8s-monitor
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
